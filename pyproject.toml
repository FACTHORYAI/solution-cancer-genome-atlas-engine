[project]
name = "cancer_genome_atlas_engine"
version = "0.1.0"
description = "Analyse the open data of The Cancer Genome Atlas (TCGA) across cancer types, in Facthory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "numpy>=1.26",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.scripts]
cancer_genome_atlas_engine = "cancer_genome_atlas_engine.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cancer_genome_atlas_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
